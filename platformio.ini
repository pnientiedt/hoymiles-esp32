[env:esp32]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
lib_deps =
    h2zero/NimBLE-Arduino@~1.4.2
    knolleary/PubSubClient@^2.8
    nanopb/Nanopb@^0.4.8
monitor_speed = 115200
build_flags =
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_PINNED_TO_CORE=0

[env:native]
platform = native
test_framework = unity
test_build_src = yes
; Native tests cover the pure-logic modules only. BLE/poller/handshake/proto
; depend on NimBLE/nanopb/Arduino headers that don't exist on the host.
build_src_filter = -<*> +<crypto.cpp> +<frame.cpp> +<energy_reset.cpp>
build_flags =
    -std=c++17
    -DNATIVE_TEST
    -I/opt/homebrew/opt/mbedtls@3/include
    -L/opt/homebrew/opt/mbedtls@3/lib
    -lmbedcrypto
