[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    knolleary/PubSubClient@^2.8
    nanopb/Nanopb@^0.4.8
monitor_speed = 115200
build_flags =
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_PINNED_TO_CORE=0
    -DMQTT_MAX_PACKET_SIZE=512

[env:native]
platform = native
test_framework = unity
test_build_src = yes
; Native tests cover the pure-logic modules only. BLE/poller/handshake/proto
; depend on NimBLE/nanopb/Arduino headers that don't exist on the host.
build_src_filter = -<*> +<crypto.cpp> +<frame.cpp>
build_flags =
    -std=c++17
    -DNATIVE_TEST
    -I/opt/homebrew/Cellar/mbedtls@3/3.6.6/include
    -L/opt/homebrew/Cellar/mbedtls@3/3.6.6/lib
    -lmbedcrypto
